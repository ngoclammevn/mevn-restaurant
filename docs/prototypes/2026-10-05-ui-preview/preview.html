<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cơm Trưa · Duyệt thiết kế</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9ede9;color:#23372a;font:14px/1.5 system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px;background:#fff;border-bottom:1px solid #cdd8ce}strong{font-size:16px}p{margin:3px 0;font-size:13px;color:#516356}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:end}button,a,select{font:inherit;cursor:pointer;min-height:44px;padding:10px 12px;border:1px solid #a5b6a8;border-radius:10px;background:#fff;color:#23372a;text-decoration:none}label{display:grid;gap:4px;font-size:12px}button[aria-pressed=true]{background:#1f6e45;border-color:#1f6e45;color:#fff}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #177448;outline-offset:3px}main{padding:16px;display:flex;justify-content:center}iframe{display:block;width:100%;height:calc(100dvh - 175px);min-height:550px;border:1px solid #c4cec5;background:#fafaf7;border-radius:16px;box-shadow:0 10px 40px #23372a12;transition:width .2s}iframe.phone{width:390px;max-width:100%}footer{text-align:center;padding:0 16px 12px}@media(max-width:600px){header{padding:10px 12px}nav{width:100%;gap:6px}nav label{flex:1;min-width:140px}select{width:100%;max-width:100%}nav button,nav a{flex:1;white-space:nowrap}main{padding:8px}iframe{min-height:500px}}@media(prefers-reduced-motion:reduce){iframe{transition:none}}</style>
<header><div><strong>Cơm Trưa · Bản xem trước UI</strong><p>Dữ liệu minh họa · Chờ duyệt thiết kế</p></div><nav aria-label="Điều khiển bản xem trước"><label for="screen">Màn hình<select id="screen"><option value="today">Hôm nay</option><option value="menu">Chọn món</option><option value="post">Đăng menu</option><option value="profile">Cá nhân</option><option value="manage">Quản lý menu</option><option value="dashboard">Đơn &amp; thu tiền</option><option value="my-menus">Menu tôi đăng</option><option value="history">Lịch cơm</option><option value="taste">Khẩu vị</option><option value="changelog">Changelog / Cập nhật</option><option value="signin">Đăng nhập</option></select></label><label for="scenario">Trạng thái<select id="scenario"><option value="normal">Dữ liệu mẫu</option><option value="loading">Đang tải</option><option value="error">Lỗi kết nối</option><option value="empty">Chưa có dữ liệu</option><option value="guest">Chưa đăng nhập</option><option value="closed">Menu đã chốt</option><option value="soldout">Món vừa hết</option><option value="ai-fallback">Chưa tải được gợi ý</option></select></label><button id="desktop" aria-pressed="true">Máy tính</button><button id="phone" aria-pressed="false">Điện thoại</button><a id="standalone" href="index.html" target="_blank" rel="noopener">Mở riêng</a></nav></header>
<main><iframe title="Bản thiết kế tương tác Cơm Trưa" src="index.html"></iframe></main><footer><p>Chọn màn hình và bấm thử các luồng. “Menu đã chốt” / “Món vừa hết” dành cho màn Chọn món; “Chưa tải được gợi ý” khi mở đánh giá. Mẫu không gửi dữ liệu đến app đang dùng.</p></footer>
<script>
const frame=document.querySelector('iframe'),screenControl=document.querySelector('#screen'),stateControl=document.querySelector('#scenario');
const send=data=>frame.contentWindow.postMessage(data,location.origin);
for(const id of ['desktop','phone'])document.getElementById(id).onclick=()=>{frame.classList.toggle('phone',id==='phone');for(const n of ['desktop','phone'])document.getElementById(n).setAttribute('aria-pressed',String(n===id))};
screenControl.onchange=()=>{stateControl.value='normal';send({type:'preview-navigate',page:screenControl.value})};
stateControl.onchange=()=>send({type:'preview-scenario',scenario:stateControl.value});
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.type!=='preview-page')return;screenControl.value=e.data.page;stateControl.value=e.data.scenario;document.querySelector('#standalone').href='index.html#'+encodeURIComponent(e.data.page)});
new ResizeObserver(()=>{frame.style.height='calc(100dvh - '+(document.querySelector('header').offsetHeight+90)+'px)'}).observe(document.querySelector('header'));
</script></html>
